services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4173"
      HYPERGAMY_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "4173"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
